<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 游戏站点 · 简洁主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f7f9fc 0%, #e9edf2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .game-hub {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 3rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 8px 24px rgba(0, 20, 40, 0.06);
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.2s ease;
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #0b1a2b;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.25rem;
        }

        .subhead {
            font-size: 1rem;
            color: #4a5b6e;
            border-left: 3px solid #7b8c9e;
            padding-left: 1rem;
            margin-bottom: 2.25rem;
            font-weight: 400;
            opacity: 0.8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .add-hint {
            background: #dce3ec;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #1f2a3a;
            letter-spacing: 0.3px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .add-hint span {
            font-size: 1.1rem;
        }

        /* 游戏卡片列表 — 干净、模块化 */
        .game-list {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .game-item {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 1rem 1.8rem;
            border-radius: 60px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02), 0 1px 2px rgba(0,0,0,0.03);
            transition: all 0.15s;
            border: 1px solid rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
        }

        .game-item:hover {
            background: #ffffff;
            box-shadow: 0 8px 18px rgba(0, 20, 40, 0.08);
            border-color: #cbd8e6;
            transform: scale(1.01);
        }

        .game-info {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 0.75rem 1.2rem;
        }

        .game-name {
            font-weight: 600;
            font-size: 1.25rem;
            color: #0b1a2b;
            letter-spacing: -0.01em;
        }

        /* 网址样式 — 普通文本，无跳转，无下划线 */
        .game-url-text {
            font-size: 0.95rem;
            color: #2b4c73;
            background: #f0f5fe;
            padding: 0.2rem 1.2rem;
            border-radius: 40px;
            border: 1px solid #d4e0f0;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            word-break: break-all;
            max-width: 280px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            /* 完全移除链接样式 */
            text-decoration: none;
            cursor: default;
            pointer-events: none;
            user-select: text;
        }

        /* 移除所有交互效果，保持纯文本 */
        .game-url-text:hover {
            background: #f0f5fe;
            border-color: #d4e0f0;
            color: #2b4c73;
            box-shadow: none;
        }

        /* 空状态 & 添加指引 (仅视觉提示) */
        .add-instruction {
            margin-top: 2.8rem;
            padding: 0.8rem 1.5rem;
            background: rgba(220, 232, 245, 0.4);
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem 1.2rem;
            flex-wrap: wrap;
            border: 1px dashed #b3c9df;
            color: #1f3e5c;
            font-size: 0.95rem;
        }

        .add-instruction code {
            background: #e3ebf5;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            border: 1px solid #bccfe0;
            color: #0e2b44;
            font-weight: 500;
        }

        .add-instruction .highlight {
            background: #d7e2f0;
            padding: 0.1rem 0.7rem;
            border-radius: 30px;
            font-weight: 500;
        }

        /* 响应式 */
        @media (max-width: 700px) {
            .game-hub {
                padding: 1.8rem 1.2rem;
                border-radius: 2rem;
            }
            h1 {
                font-size: 2.0rem;
            }
            .game-item {
                padding: 0.9rem 1.2rem;
                border-radius: 40px;
                flex-direction: column;
                align-items: stretch;
                gap: 0.6rem;
            }
            .game-info {
                flex-wrap: wrap;
                gap: 0.4rem 0.8rem;
            }
            .game-url-text {
                max-width: 100%;
                white-space: normal;
                justify-content: center;
                padding: 0.3rem 1rem;
            }
            .subhead {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
                border-left: none;
                padding-left: 0;
            }
            .add-hint {
                align-self: flex-start;
            }
            .add-instruction {
                flex-direction: column;
                align-items: flex-start;
                padding: 1rem 1.2rem;
            }
        }

        @media (max-width: 450px) {
            .game-name {
                font-size: 1.1rem;
            }
            .game-url-text {
                font-size: 0.8rem;
            }
        }

        /* 模拟“添加新游戏”的视觉锚点 — 无交互 */
        .mock-add {
            background: transparent;
            border: 2px dashed #b7cbdf;
            color: #3e5f7e;
            justify-content: center;
            opacity: 0.6;
            pointer-events: none;
            padding: 0.5rem 1.5rem;
        }

        .mock-add .game-name {
            color: #3f5f7e;
            font-weight: 400;
        }

        .mock-add .game-url-text {
            background: #eef3fa;
            border-color: #cbdae9;
            color: #3d5f82;
        }
        .mock-add:hover {
            transform: none;
            border-color: #b7cbdf;
            background: transparent;
        }
    </style>
</head>
<body>
<div class="game-hub">
    <header>
        <h1>🕹️ 游戏驿站</h1>
        <div class="subhead">
            <span>🎯 所有游戏 · 直达网址（纯文本）</span>
            <span class="add-hint"><span>➕</span> 添加新游戏只需复制一行</span>
        </div>
    </header>

    <!-- 游戏列表 - 完全静态，方便复制添加 -->
    <div class="game-list">
        <!-- 游戏 1 -->
        <div class="game-item">
            <div class="game-info">
                <span class="game-name">飞机游戏1</span>
            </div>
            <span class="game-url-text">/game/airplanegame.html</span>
        </div>

        <!-- 游戏 2 -->
        <div class="game-item">
            <div class="game-info">
                <span class="game-name">开车游戏1</span>
            </div>
            <span class="game-url-text">/game/cargame.html</span>
        </div>

        <!-- 游戏 3 -->
        <div class="game-item">
            <div class="game-info">
                <span class="game-name">我的世界（仅电脑端）</span>
            </div>
            <span class="game-url-text">/game/minecraft.html</span>
        </div>

        <!-- 游戏 4 -->
        <div class="game-item">
            <div class="game-info">
                <span class="game-name">飞机游戏2</span>
            </div>
            <span class="game-url-text">/game/beta/tfs2.html</span>
        </div>

        

        <!-- ‼️ 新游戏占位 — 模仿添加一行，直接复制这个结构即可 -->
        <!-- 
            👇 复制以下整块，粘贴到上面最后一个 .game-item 后面，修改名称和网址即可。
            <div class="game-item">
                <div class="game-info">
                    <span class="game-name">🎮 新游戏名称</span>
                </div>
                <span class="game-url-text">你的游戏网址.com</span>
            </div>
        -->
    </div>

    
    
    
</div>
</body>
</html>
